# Attribution rules
# Each rule defines (1) which coordinate system the signal lives in,
# (2) what evidence must be present, (3) the attributed cause, and (4) the recommended action.
# Conditions listed under `require` are re-verified in code by the Verification Gate.

version: 1

metrics:
  adi_offset:    Wafer-mean ADI CD minus target (nm). Scalar component applied across the whole wafer.
  adi_radial:    Coefficient of the ADI residual regressed on (r/R)^2 (nm). Wafer-radial coordinate system.
  adi_slit:      Amplitude converted from the intra-field X-direction slope (nm). Scanner slit coordinate system.
  adi_reticle:   Residual that repeats at a fixed site after removing the slit component (nm). Reticle coordinate system.
  delta_bias:    (ACI - ADI) mean minus the reference etch bias (nm).
  delta_radial:  Coefficient of delta-CD regressed on (r/R)^2 (nm).
  tool_drift:    Movement of monitor-wafer re-measurement vs. baseline (nm).
  tmu_ratio:     Percentage of the process tolerance budget (+/-6.0 nm) consumed by measurement uncertainty (TMU).
                 TMU = RSS(dynamic precision 3sigma, tool-to-tool match).
                 Convention caps this at 20%; above that, the tool's readings cannot be used to disposition process.
  chamber_dev:   This chamber's windowed mean delta-CD minus the fleet mean (nm).
  taper_dev:     Change in cross-section taper (BCD-TCD) vs. baseline (nm).

rules:

  - id: PHOTO_DOSE
    label: Photo dose drift
    module: Photo
    coordinate: Wafer scalar
    when: [adi_offset_exceeds]
    require:
      - adi_radial_within_limit      # if the radial component also grew, track may be the cause
      - adi_reticle_within_limit
    cause: >
      Wafer-mean ADI CD shifted as a whole, while the radial component, slit fingerprint, and
      reticle-repeat component are all within their control limits. The excursion is not
      concentrated at any wafer location — it is a uniform wafer-mean shift — which is the
      fingerprint of a factor that acts identically across the entire wafer. Exposure dose
      fits this pattern. If the Setting value (recipe input) held steady while only the
      Energy Sensor readback moved, a gap opened between effective dose and setting, which
      points first to a Dose Mapper / Energy Sensor Calibration excursion.
    action: >
      Order matters. (1) Check for a gap between the Setting value and the Energy Sensor
      readback first. If a gap exists, re-run Dose Mapper / Energy Sensor Calibration before
      touching the recipe — adjusting Setting alone leaves effective dose unchanged and the
      excursion recurs. (2) Query PM / Inform history for change points around this time —
      Laser Source replacement, illuminator optical component swap, most recent calibration
      date. A change point aligned with the CD shift is the leading candidate.
      (3) Determine whether the Energy Sensor time series is a single step change or a
      sustained drift. A step points to a change point; drift points to sensor
      degradation/contamination. (4) Pull source characteristic parameters alongside it —
      Pulse Energy Stability (Energy Sigma), Bandwidth (E95), illuminator transmission
      efficiency. A source swap that shifts wavelength characteristics changes effective dose
      even at the same Setting. (5) Confirm no change points exist on the Track side
      (Develop / PEB conditions) to establish the exclusion evidence for Photo attribution.
      (6) After the fix, verify Before/After CD recovery on a rework lot — this is caught at
      ADI, so the out-of-spec wafers are still inside the rework window. (7) Prevent
      recurrence — put an SPC control chart on the Energy Sensor readback with an OCAP that
      alarms when the deviation from Setting exceeds the limit, and add Calibration as a
      mandatory Change Control Checklist item for source replacements.
    risk: Normal

  - id: PHOTO_TRACK_RADIAL
    label: Track/PEB radial profile shift
    module: Photo(Track)
    coordinate: Wafer radial
    when: [adi_radial_exceeds]
    require: [delta_within_limit_or_absent]
    cause: >
      Regressing the ADI residual on (r/R)^2 shows the radial coefficient outside its control
      limit, while the wafer mean itself did not move materially. A factor that acts uniformly
      across the wafer, such as dose, cannot produce this shape. This points to a shift in the
      PEB plate temperature profile or the radial distribution of coating thickness. Delta-CD
      (etch bias) is normal, which excludes post-etch factors.
    action: >
      (1) Query the PEB plate temperature map for this Track (per-zone setpoints and
      readbacks) for a zone heater fault or a change in the temperature correction table.
      (2) Check the coater spin profile and the radial distribution of resist coating
      thickness. (3) Query Track PM / Inform history for change points around this time.
      (4) The radial component cannot be offset by scanner dose correction. An R2R feedback
      loop that only corrects wafer mean will push center and edge further apart in opposite
      directions and make CDU worse — do not respond with dose correction.
    risk: Watch

  - id: RETICLE_CD_ERROR
    label: Reticle CD error
    module: Photo(Reticle)
    coordinate: Site-fixed within field
    when: [adi_reticle_exceeds]
    require: [adi_reticle_repeats_across_fields]
    cause: >
      The deviation appears only at specific sites and repeats identically across every
      field. It is independent of both the wafer and radial coordinate systems, so it is
      attributed to a CD error on the mask itself.
    action: >
      (1) Expose this reticle on a different scanner and check whether the same sites show
      the same deviation. If it reproduces, it follows the reticle; if it follows the scanner
      instead, it is a scanner fingerprint. (2) Pull the mask CD measurement certificate and
      recent cleaning/repair history. (3) Also check for pellicle contamination or mask CD
      degradation. (4) Do not touch scanner dose or the etch recipe first — this component is
      fixed at the site and is not offset by a wafer-level correction.
    risk: Watch

  - id: ETCH_CHAMBER
    label: Etch chamber deviation / PM drift
    module: Etch
    coordinate: Wafer radial + chamber
    when: [delta_bias_exceeds]
    require:
      - chamber_specific            # must be confined to a specific chamber
      - metrology_healthy           # metrology must be healthy to attribute a process cause
      - tmu_within_budget           # measurement uncertainty above 20% of budget invalidates the call
      - metrology_evidence_fresh    # stale monitor data means "healthy" cannot be asserted
      - taper_not_contradicting     # a real etch change should move cross-section taper too
    cause: >
      ADI is normal but delta-CD has shifted, confined to a specific chamber and accompanied
      by a wafer-radial component. Attributed to plasma uniformity, gas flow, ESC temperature
      change, or cumulative drift following PM.
    action: >
      (1) Isolate the chamber and re-measure etch bias on a chamber-matching wafer.
      (2) Plot bias vs. RF hours to distinguish seasoning drift from a one-off excursion —
      separate the immediate post-PM transient (first-wafer effect) from the slower drift
      that follows. (3) Query OES / RF / pressure traces for change points in this window.
      (4) Cross-check chamber PM history and wet-clean dates against the CD shift timing.
      (5) ACI cannot be reworked. Until the chamber is fixed, temporarily bias the ADI target
      on subsequent lots to bring final CD back inside spec, then revert once the chamber fix
      is confirmed.
    risk: High

  - id: METROLOGY_TOOL_DRIFT
    label: Metrology tool offset drift
    module: Metrology
    coordinate: None (tool-dependent)
    when: [delta_bias_exceeds]
    require:
      - tool_drift_exceeds          # did the monitor wafer move in the same direction?
      # not_chamber_specific is treated only as supporting evidence. If the monitor wafer
      # moved, the correct move is to fix the "ruler" first and redispose regardless of
      # whether the shift also looks chamber-specific.
    cause: >
      Delta-CD has shifted, but it is not concentrated in any one chamber — it appears only
      in lots measured by a specific metrology tool. The monitor wafer, which the process
      never touches, re-measured with a shift in the same direction, so this is a metrology
      tool offset drift rather than a process change.
    action: >
      (1) Hold process action. Touching chamber recipes in this state would mis-tune
      otherwise healthy equipment. (2) Pull this CD-SEM's monitor-wafer re-measurement
      history and most recent calibration date, and re-run calibration.
      (3) Recompute the tool-to-tool matching offset between the two tools. (4) Redisposition
      every lot measured by this tool during the affected window. (5) Review whether the
      monitor-wafer check interval should be shortened — in this case, an insufficient watch
      cadence is what allowed disposition to stall. (6) Decompose the TMU term to see whether
      precision or tool-to-tool match is consuming the budget — if match dominates, re-tune
      fleet matching; if precision dominates, review recipe (frame count, magnification,
      landing energy) or tool condition.
    risk: High

  - id: INDETERMINATE
    label: Disposition withheld
    module: "-"
    coordinate: "-"
    when: [delta_bias_exceeds]
    require: []
    cause: >
      An excursion was detected but there is not enough evidence to pin down a cause.
      Neither chamber concentration nor metrology drift meets its threshold, or the
      supporting data is simply missing.
    action: >
      Request additional measurement — a chamber-matching wafer, an ad-hoc monitor-wafer
      re-measurement, and a cross-section taper check. No disposition target is named
      without evidence.
    risk: Watch

  - id: NORMAL
    label: Normal
    module: "-"
    coordinate: "-"
    when: []
    require: []
    cause: All components are within their control limits.
    action: No action required.
    risk: Normal
